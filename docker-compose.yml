services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_admin
    ports:
      - "5433:5432"
    volumes:
      - platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_admin"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  platform_pg:
